services:
  - type: web
    name: razorshield-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: {name: razorshield-db, property: connectionString}
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"
databases:
  - name: razorshield-db
    databaseName: razorshield
    user: razorshield
