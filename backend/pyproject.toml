[build-system]
requires = ["setuptools>=75.8,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "razorshield-backend"
version = "0.1.0"
description = "Defense-only coordinated return-abuse risk operations backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.5",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["app*"]
